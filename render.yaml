---
# Render Blueprint Specification for ECU Men's Ice Hockey Calendar Service
# https://render.com/docs/blueprint-spec
services:
  # Web Service: FastAPI Calendar & Data API
  - type: web
    name: ecu-hockey-api
    runtime: image
    image:
      url: ghcr.io/bdperkin/ecu-hockey-calendar:edge
    plan: 0.5c-512mb
    region: oregon
    preDeployCommand: alembic upgrade head
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ecu-hockey-db
          property: connectionString
      - key: ADMIN_API_TOKEN
        generateValue: true
      - key: AUTO_MIGRATE
        value: 'true'
      - key: LOG_LEVEL
        value: info
      - key: DISCORD_WEBHOOK_URL
        sync: false
      - key: SLACK_WEBHOOK_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false

  # Scheduled Cron Worker: Multi-Source Schedule Synchronization & Change Detection
  - type: cron
    name: ecu-hockey-worker
    runtime: image
    image:
      url: ghcr.io/bdperkin/ecu-hockey-calendar:edge
    plan: 0.5c-512mb
    region: oregon
    schedule: 0 */6 * * *
    dockerCommand: ecu-hockey sync --notify
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ecu-hockey-db
          property: connectionString
      - key: ADMIN_API_TOKEN
        fromService:
          type: web
          name: ecu-hockey-api
          envVarKey: ADMIN_API_TOKEN
      - key: DISCORD_WEBHOOK_URL
        sync: false
      - key: SLACK_WEBHOOK_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
databases:
  - name: ecu-hockey-db
    plan: 0.1c-256mb
    region: oregon
    databaseName: ecu_hockey
    user: ecu_hockey_user
