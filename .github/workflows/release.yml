---
name: Release
on:
  workflow_dispatch:
    inputs:
      force_level:
        description: Release bump level (minor for milestones, patch for bugfixes, major for
          1.0.0, or auto)
        required: true
        default: minor
        type: choice
        options: [minor, patch, major, auto]
      prerelease:
        description: Release as prerelease
        required: false
        default: false
        type: boolean
jobs:
  release:
    name: Semantic Release & Changelog
    runs-on: ubuntu-latest
    concurrency: release
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: uv sync --all-extras --dev
      - name: Run Python Semantic Release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |-
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          ARGS=""
          if [ "${{ inputs.force_level }}" = "minor" ]; then
            ARGS="--minor"
          elif [ "${{ inputs.force_level }}" = "patch" ]; then
            ARGS="--patch"
          elif [ "${{ inputs.force_level }}" = "major" ]; then
            ARGS="--major"
          fi
          if [ "${{ inputs.prerelease }}" = "true" ]; then
            ARGS="$ARGS --prerelease"
          fi
          # shellcheck disable=SC2086
          uv run semantic-release version $ARGS
          uv run semantic-release publish
