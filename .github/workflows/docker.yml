---
name: Docker
on:
  push:
    branches: [main]
    tags: [v*.*.*]
  pull_request:
    branches: [main]
    paths:
      - Dockerfile
      - docker-compose.yml
      - pyproject.toml
      - uv.lock
      - src/**
      - alembic/**
      - alembic.ini
      - .dockerignore
      - .github/workflows/docker.yml
  release:
    types: [published]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
jobs:
  build-and-push:
    name: Build & Publish Multi-Arch Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false
      - name: Resolve package version
        id: pkg_version
        run: |
          VERSION=$(uv run --with hatch-vcs python -c \
            "from hatch_vcs.version_source import VCSVersionSource; print(VCSVersionSource('.', {}).get_version_data()['version'])")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved package version for container build: ${VERSION}"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}
            type=ref,event=branch
            type=ref,event=pr
            type=edge,branch=main
            type=sha,format=short
      - name: Build and push Docker image
        id: build-push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PACKAGE_VERSION=${{ steps.pkg_version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
