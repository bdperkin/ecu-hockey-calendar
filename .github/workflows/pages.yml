---
name: Pages
on:
  push:
    branches: [main]
    paths:
      - docs/**
      - src/**
      - static/**
      - README.md
      - CONTRIBUTING.md
      - CHANGELOG.md
      - pyproject.toml
      - .github/workflows/pages.yml
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    name: Build Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: uv sync --all-extras --dev
      - name: Ensure static calendar assets
        run: |-
          if [ ! -f static/calendar.ics ] || [ ! -f static/schedule.json ] || [ ! -f static/schedule.csv ]; then
            echo "Generating static calendar assets for GitHub Pages..."
            mkdir -p static
            export DATABASE_URL="sqlite:///ecu_hockey.db"
            uv run alembic upgrade head
            uv run ecu-hockey export -f ics -o static/calendar.ics
            uv run ecu-hockey export -f json -o static/schedule.json
            uv run ecu-hockey export -f csv -o static/schedule.csv
          else
            echo "Static calendar assets already present in static/ directory."
          fi
      - name: Build Sphinx Documentation (-W warnings as errors)
        run: uv run sphinx-build -W -b html docs docs/_build/html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html
  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
