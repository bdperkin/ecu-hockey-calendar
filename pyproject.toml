[build-system]
build-backend = "hatchling.build"
requires = [ "hatch-vcs", "hatchling" ]

[project]
name = "ecu-hockey-calendar"
description = "East Carolina University - Men's Ice Hockey Team - Calendar"
readme = "README.md"
keywords = [ "calendar", "ecu", "hockey", "icalendar", "ics" ]
license = "MIT"
authors = [ { name = "Brandon Perkins", email = "bdperkin@gmail.com" } ]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dynamic = [ "version" ]
dependencies = [
    "aiosqlite>=0.20.0",
    "alembic>=1.13.0",
    "beautifulsoup4>=4.12.0",
    "click>=8.1.0",
    "fastapi>=0.141.1",
    "httpx>=0.27.0",
    "jinja2>=3.1.4",
    "psycopg[binary]>=3.2.0",
    "rich>=13.0.0",
    "sqlalchemy>=2.0.0",
    "uvicorn>=0.52.4",
    "weasyprint>=70.0",
]
optional-dependencies.dev = [
    "codespell>=2.4.0",
    "coverage[toml]>=7.6.0",
    "deptry>=0.23.0",
    "furo>=2024.8.6",
    "interrogate>=1.7.0",
    "markdown-toc-creator>=0.1.3",
    "mdformat>=0.7.21",
    "myst-parser>=4.0.0",
    "pre-commit>=4.1.0",
    "pylint>=3.3.0",
    "pymarkdownlnt>=0.9.29",
    "pyproject-fmt>=2.5.0",
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "pytest-rerunfailures>=15.0.0",
    "python-semantic-release>=9.16.0",
    "radon>=6.0.1",
    "ruff>=0.9.0",
    "sphinx>=8.1.0",
    "sphinx-autodoc-typehints>=3.0.0",
    "vulture>=2.14",
    "xenon>=0.9.3",
    "yamlfix>=1.17.0",
]
optional-dependencies.docs = [
    "furo>=2024.8.6",
    "myst-parser>=4.0.0",
    "sphinx>=8.1.0",
    "sphinx-autodoc-typehints>=3.0.0",
]
optional-dependencies.lint = [
    "codespell>=2.4.0",
    "deptry>=0.23.0",
    "interrogate>=1.7.0",
    "pylint>=3.3.0",
    "radon>=6.0.1",
    "ruff>=0.9.0",
    "vulture>=2.14",
    "xenon>=0.9.3",
]
optional-dependencies.test = [
    "coverage[toml]>=7.6.0",
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "pytest-rerunfailures>=15.0.0",
]
urls.Changelog = "https://github.com/bdperkin/ecu-hockey-calendar/blob/main/CHANGELOG.md"
urls.Documentation = "https://github.com/bdperkin/ecu-hockey-calendar#readme"
urls.Homepage = "https://github.com/bdperkin/ecu-hockey-calendar"
urls.Issues = "https://github.com/bdperkin/ecu-hockey-calendar/issues"
urls.Repository = "https://github.com/bdperkin/ecu-hockey-calendar"
scripts.ecu-hockey = "ecu_hockey_calendar.cli:main"

[dependency-groups]
dev = [
    "mdformat-gfm>=1.0.0",
    "pytest-rerunfailures>=16.6.1",
]

[tool.hatch]
version.source = "vcs"
version.raw-options = { dist_name = "ecu-hockey-calendar", fallback_version = "0.0.0+unknown" }
build.hooks.vcs.version-file = "src/ecu_hockey_calendar/_version.py"
build.targets.wheel.packages = [ "src/ecu_hockey_calendar" ]
build.targets.wheel.artifacts = [ "src/ecu_hockey_calendar/api/templates/**" ]

[tool.ruff]
target-version = "py312"
line-length = 88
src = [ "src", "tests", "tools" ]
extend-exclude = [
    "src/ecu_hockey_calendar/_version.py",
]
lint.select = [
    "ALL",
]
lint.ignore = [
    "COM812", # Trailing comma missing (formatter compatibility)
    "CPY001", # Missing copyright notice at top of file
    "D203",   # 1 blank line before class (conflicts with D211)
    "D213",   # Multi-line docstring summary start (conflicts with D212)
    "ISC001", # Implicitly concatenated string (formatter compatibility)
]
lint.per-file-ignores."alembic/**" = [
    "D",
    "E501",
    "INP001",
    "TC",
]
lint.per-file-ignores."docs/conf.py" = [
    "A001",
    "INP001",
]
lint.per-file-ignores."src/ecu_hockey_calendar/calendar.py" = [
    "A005",
]
lint.per-file-ignores."src/ecu_hockey_calendar/cli/**" = [
    "FBT001",
    "FBT002",
]
lint.per-file-ignores."tests/**" = [
    "ANN",
    "ARG",
    "D",
    "EM",
    "PLR2004",
    "PT012",
    "S101",
    "S104",
    "S105",
    "S106",
    "SLF001",
    "TC",
    "TRY",
]
lint.per-file-ignores."tools/**" = [
    "INP001",
    "S603",
    "T201",
]
lint.isort.known-first-party = [ "ecu_hockey_calendar" ]
lint.pydocstyle.convention = "google"
lint.pylint.max-args = 8

[tool.pylint]
main.ignore = [ "_version.py" ]
main.py-version = "3.12"
main.source-roots = [ "src" ]
messages_control.disable = [
    "duplicate-code",
    "line-too-long",
    "missing-module-docstring",
    "not-callable",
    "redefined-outer-name",
    "too-few-public-methods",
]
design.max-args = 8
design.max-attributes = 12
imports.known-third-party = [ "alembic" ]

[tool.codespell]
ignore-words = ".codespell-ignore"
ignore-words-list = "hist"
skip = "*.git,*.lock,*.pyc,*.png,*.ico,.venv,build,dist,htmlcov,site,_version.py,*docs/_build*,*static*"
quiet-level = 3

[tool.interrogate]
fail-under = 100
ignore-init-method = false
ignore-init-module = false
ignore-magic = false
ignore-semiprivate = false
ignore-private = false
ignore-property-decorators = false
ignore-module = false
ignore-nested-functions = false
ignore-nested-classes = false
ignore-setters = false
exclude = [
    ".venv",
    "alembic",
    "build",
    "dist",
    "docs",
    "setup.py",
    "src/ecu_hockey_calendar/_version.py",
    "tests",
    "tools"
]
color = true
verbose = 2

[tool.deptry]
extend_exclude = [ "alembic", "docs", "src/ecu_hockey_calendar/_version.py", "tools" ]
known_first_party = [ "ecu_hockey_calendar" ]
optional_dependencies_dev_groups = [ "dev", "docs", "lint", "test" ]

[tool.vulture]
paths = [ "src", "tests" ]
exclude = [ "src/ecu_hockey_calendar/_version.py" ]
min_confidence = 80
sort_by_size = true

[tool.pyproject-fmt]
indent = 4
keep_full_version = true
max_supported_python = "3.14"

[tool.ty]
src.include = [ "src", "tests", "tools" ]
src.exclude = [
    "src/ecu_hockey_calendar/_version.py",
]
environment.python-version = "3.12"
rules.all = "error"
rules.unsound-assignment = "ignore"
terminal.error-on-warning = true

[tool.pytest]
ini_options.minversion = "8.0"
ini_options.testpaths = [ "tests" ]
ini_options.pythonpath = [ "src" ]
ini_options.addopts = """\
    -ra --strict-markers --strict-config --cov=ecu_hockey_calendar --cov-report=term-missing --cov-report=html \
    --cov-report=xml --cov-fail-under=100\
    """
ini_options.filterwarnings = [
    "error",
    "ignore::ResourceWarning",
    "ignore::pytest.PytestUnraisableExceptionWarning",
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
    "ignore::DeprecationWarning:anyio.*",
    "ignore::DeprecationWarning:starlette.*",
]

[tool.coverage]
run.source = [ "src/ecu_hockey_calendar" ]
run.omit = [
    "src/ecu_hockey_calendar/_version.py",
]
run.branch = true
report.fail_under = 100
report.exclude_lines = [
    "\\.\\.\\.",
    "def __repr__",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "pragma: no cover",
    "raise NotImplementedError",
]
report.skip_covered = false
report.show_missing = true
html.directory = "htmlcov"
xml.output = "coverage.xml"

[tool.semantic_release]
tag_format = "v{version}"
major_on_zero = false
allow_zero_version = true
build_command = "uv build"
no_git_verify = true
commit_author.default = "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
commit_author.env = "GIT_COMMIT_AUTHOR"
commit_parser_options.allowed_tags = [
    "build",
    "chore",
    "ci",
    "docs",
    "feat",
    "fix",
    "milestone",
    "perf",
    "refactor",
    "style",
    "test",
]
commit_parser_options.minor_tags = [ "feat", "milestone" ]
commit_parser_options.patch_tags = [ "fix", "perf" ]
branches.main.match = "(main|master)"
branches.main.prerelease = false
changelog.default_templates.changelog_file = "CHANGELOG.md"
changelog.default_templates.mask_initial_release = true
changelog.default_templates.output_format = "md"
changelog.exclude_commit_patterns = []
changelog.insertion_flag = "<!-- version list -->"
changelog.mode = "update"

[tool.yamlfix]
line_length = 88
indent_mapping = 2
indent_offset = 2
indent_sequence = 4

[tool.markdown_toc_creator]
proactive = true
style = "github"
in_place = true
add_toc_title = true
add_horizontal_rules = true
horizontal_rule_style = "mdformat"
skip_first_n_lines = 1
exclude = "\\.git|\\.tox|\\.pytest_cache|\\.venv|node_modules"

[tool.pymarkdown]
plugins.md013.enabled = false
plugins.md024.siblings_only = true
plugins.md036.enabled = false
